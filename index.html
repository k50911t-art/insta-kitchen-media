<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くらしの便利帳</title>
<meta name="description" content="暮らしに役立つキッチン用品まとめ">
<style>* { margin: 0; padding: 0; } img { max-width: 100%; }</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3E6;
    --hero: #DD5B21;
    --hero-deep: #C24A19;
    --hero-ink: #FFF6EA;
    --surface: #FFFFFF;
    --surface-2: #FFF9F0;
    --ink: #33261B;
    --ink-muted: #8C7862;
    --accent: #DD5B21;
    --star: #C4901F;
    --line: #EBDCC4;
    --badge-ink: #FFF6EA;
    --shadow: 0 1px 2px rgba(51,38,27,0.06), 0 6px 16px rgba(51,38,27,0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E140D;
      --hero: #C24A19;
      --hero-deep: #9E3B12;
      --hero-ink: #FFF3E4;
      --surface: #2A1D14;
      --surface-2: #241910;
      --ink: #F2E4D4;
      --ink-muted: #B99E82;
      --accent: #E97A3E;
      --star: #D8A742;
      --line: #4A3722;
      --badge-ink: #FFF3E4;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1E140D;
    --hero: #C24A19;
    --hero-deep: #9E3B12;
    --hero-ink: #FFF3E4;
    --surface: #2A1D14;
    --surface-2: #241910;
    --ink: #F2E4D4;
    --ink-muted: #B99E82;
    --accent: #E97A3E;
    --star: #D8A742;
    --line: #4A3722;
    --badge-ink: #FFF3E4;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hero {
    background: linear-gradient(160deg, var(--hero) 0%, var(--hero-deep) 100%);
    color: var(--hero-ink);
    padding: 40px 24px 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .hero__avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin-bottom: 4px;
  }

  .hero__name {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-weight: 900;
    font-size: 1.5rem;
    text-wrap: balance;
    letter-spacing: 0.02em;
  }

  .hero__tagline {
    font-size: 0.9rem;
    opacity: 0.92;
    line-height: 1.6;
    max-width: 30ch;
  }

  .hero__ig {
    margin-top: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  main {
    flex: 1;
    padding: 28px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  section.theme-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .theme-header {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 0 2px;
  }

  .theme-header__eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .theme-header__title {
    font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif;
    font-weight: 700;
    font-size: 1.18rem;
    text-wrap: balance;
  }

  .theme-header__tagline {
    font-size: 0.82rem;
    color: var(--ink-muted);
    line-height: 1.5;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  a.product-card {
    display: grid;
    grid-template-columns: 34px 76px 1fr;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 14px 10px 10px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  a.product-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(51,38,27,0.08), 0 10px 22px rgba(51,38,27,0.1);
  }

  a.product-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .rank-badge {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--badge-ink);
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .product-thumb {
    width: 76px;
    height: 76px;
    border-radius: 12px;
    object-fit: cover;
    background: var(--surface-2);
    flex-shrink: 0;
  }

  .product-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .product-name {
    font-size: 0.86rem;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .product-price {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .product-rating {
    font-size: 0.74rem;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 3px;
    font-variant-numeric: tabular-nums;
  }

  .product-rating__star {
    color: var(--star);
  }

  footer {
    padding: 22px 24px 36px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 0.72rem;
    line-height: 1.8;
    border-top: 1px solid var(--line);
    margin-top: 14px;
  }

  footer .pr-badge {
    display: inline-block;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    a.product-card { transition: none; }
  }
</style>

<div class="page">
  <div class="hero">
    <div class="hero__avatar">🍳</div>
    <div class="hero__name">くらしの便利帳</div>

    <div class="hero__ig">@kurashinobenri</div>

  <main id="sections"></main>

  <footer>

</div>

<script>
  const sections = JSON.parse(document.getElementById('link-data').textContent);
  const root = document.getElementById('sections');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderStars(rating) {
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(Math.max(0, 5 - full));
  }

  sections.forEach(section => {
    const sec = document.createElement('section');
    sec.className = 'theme-section';

    const header = document.createElement('div');
    header.className = 'theme-header';
    header.innerHTML = `
      <div class="theme-header__eyebrow">今週のピックアップ</div>
      <div class="theme-header__title">${escapeHtml(section.theme)}</div>
      <div class="theme-header__tagline">${escapeHtml(section.tagline)}</div>
    `;
    sec.appendChild(header);

    const list = document.createElement('div');
    list.className = 'card-list';

    section.items.forEach((item, i) => {
      const a = document.createElement('a');
      a.className = 'product-card';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener sponsored';
      a.innerHTML = `
        <span class="rank-badge">${i + 1}</span>
        <img class="product-thumb" src="${item.image}" alt="${escapeHtml(item.name)}" loading="lazy">
        <span class="product-info">
          <span class="product-name">${escapeHtml(item.name)}</span>
          <span class="product-meta">
            <span class="product-price">¥${item.price.toLocaleString()}</span>
            <span class="product-rating"><span class="product-rating__star">${renderStars(item.rating)}</span> ${item.rating.toFixed(2)}(${item.reviews.toLocaleString()})</span>
          </span>
        </span>
      `;
      list.appendChild(a);
    });

    sec.appendChild(list);
    root.appendChild(sec);
  });
</script>

</body>
